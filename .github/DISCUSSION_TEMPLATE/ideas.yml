title: "Idea: "
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are open conversations. Others can vote and add to them. **Everything here is public.** Never attach your documents.
  - type: textarea
    id: description
    attributes:
      label: Your idea
      description: What would you like Noduct to do, and why?
    validations:
      required: true
  - type: checkboxes
    id: no-personal-files
    attributes:
      label: Privacy
      options:
        - label: I did not attach my documents or anything with personal information.
          required: true

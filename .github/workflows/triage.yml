name: Triage
# Issue content is untrusted. Never interpolate `${{ github.event.issue.* }}` into `run:` steps;
# the script reads the payload as data through actions/github-script.
on:
  issues:
    types: [opened, edited, reopened]
permissions: {}
concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      # Checks out this repository's default branch (trusted code), never issue content.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { run } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.mjs`);
            await run({ github, context });
